<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduTutor BD — অগ্রগতি</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    .weekly-card{
      background:white;border:1.5px solid rgba(29,158,117,0.15);
      border-radius:16px;padding:22px;margin-bottom:20px;
    }
    .weekly-title{font-family:'Poppins',sans-serif;font-size:17px;font-weight:700;margin-bottom:16px;color:#0d1f1a;}
    .chart-wrap{position:relative;height:200px;}
  </style>
</head>
<body class="main-page">
  <nav class="navbar">
    <div class="nav-logo"><a href="home.html">🎓 EduTutor BD</a></div>
    <div class="nav-user"><button class="btn btn-sm" onclick="logout()">লগআউট</button></div>
  </nav>
  <div class="main-container">
    <h2>📊 আমার অগ্রগতি</h2>
    <div id="loading-progress" class="loading"><div class="spinner"></div><p>লোড হচ্ছে...</p></div>
    <div id="progress-content" style="display:none">
      <div class="stats-row">
        <div class="stat-card"><div class="stat-number" id="total-sessions">০</div><div class="stat-label">মোট সেশন</div></div>
        <div class="stat-card"><div class="stat-number" id="avg-score">০%</div><div class="stat-label">গড় স্কোর</div></div>
        <div class="stat-card"><div class="stat-number" id="streak-count">০</div><div class="stat-label">🔥 Streak</div></div>
      </div>

      <!-- Weekly Chart -->
      <div class="weekly-card">
        <div class="weekly-title">📅 সাপ্তাহিক রিপোর্ট</div>
        <div class="chart-wrap"><canvas id="weeklyChart"></canvas></div>
      </div>

      <div id="subject-progress"></div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/progress.js"></script>
</body>
</html>
