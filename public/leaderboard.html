<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduTutor BD — Leaderboard</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    .lb-header{
      background:linear-gradient(135deg,#085041,#1D9E75);
      border-radius:16px;padding:28px;text-align:center;
      color:white;margin-bottom:24px;
    }
    .lb-header h2{font-family:'Poppins',sans-serif;font-size:26px;font-weight:800;margin-bottom:6px;}
    .lb-header p{opacity:.85;font-size:14px;}
    .lb-podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin-bottom:28px;}
    .podium-item{text-align:center;width:100px;}
    .podium-avatar{
      width:56px;height:56px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:22px;font-weight:800;margin:0 auto 8px;
      font-family:'Poppins',sans-serif;
    }
    .podium-item.rank-1 .podium-avatar{background:#FFD700;color:#7a5800;width:68px;height:68px;font-size:26px;}
    .podium-item.rank-2 .podium-avatar{background:#C0C0C0;color:#555;}
    .podium-item.rank-3 .podium-avatar{background:#CD7F32;color:#4a2900;}
    .podium-name{font-size:13px;font-weight:700;color:#0d1f1a;margin-bottom:4px;}
    .podium-score{font-size:12px;color:#666;}
    .podium-block{border-radius:8px 8px 0 0;width:100%;}
    .podium-item.rank-1 .podium-block{background:#FFD700;height:60px;}
    .podium-item.rank-2 .podium-block{background:#C0C0C0;height:44px;}
    .podium-item.rank-3 .podium-block{background:#CD7F32;height:32px;}
    .podium-rank{font-family:'Poppins',sans-serif;font-size:20px;font-weight:800;color:white;display:flex;align-items:center;justify-content:center;height:100%;}
    .lb-list{display:flex;flex-direction:column;gap:10px;}
    .lb-item{
      background:white;border:1.5px solid rgba(29,158,117,0.12);
      border-radius:12px;padding:14px 18px;
      display:flex;align-items:center;gap:14px;
      transition:transform .2s;
    }
    .lb-item:hover{transform:translateX(4px);}
    .lb-item.me{border-color:rgba(29,158,117,0.5);background:#E1F5EE;}
    .lb-rank{
      font-family:'Poppins',sans-serif;font-size:16px;font-weight:800;
      color:#888;min-width:28px;text-align:center;
    }
    .lb-rank.top3{color:#EF9F27;}
    .lb-avatar{
      width:40px;height:40px;border-radius:50%;
      background:linear-gradient(135deg,#1D9E75,#085041);
      color:white;font-weight:800;font-size:16px;
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;
    }
    .lb-info{flex:1;}
    .lb-name{font-weight:700;font-size:15px;color:#0d1f1a;}
    .lb-meta{font-size:12px;color:#888;margin-top:2px;}
    .lb-score{text-align:right;}
    .lb-points{font-family:'Poppins',sans-serif;font-size:18px;font-weight:800;color:#1D9E75;}
    .lb-pts-label{font-size:11px;color:#aaa;}
    .me-badge{
      background:#1D9E75;color:white;
      font-size:10px;font-weight:700;
      padding:2px 8px;border-radius:10px;margin-left:6px;
    }
  </style>
</head>
<body class="main-page">
  <nav class="navbar">
    <div class="nav-logo"><a href="home.html">🎓 EduTutor BD</a></div>
    <div class="nav-user"><button class="btn btn-sm" onclick="logout()">লগআউট</button></div>
  </nav>
  <div class="main-container">
    <div class="lb-header">
      <h2>🏆 Leaderboard</h2>
      <p>সেরা শিক্ষার্থীদের তালিকা — তুমি কোথায় আছো?</p>
    </div>

    <div id="loading-lb" class="loading"><div class="spinner"></div><p>লোড হচ্ছে...</p></div>
    <div id="lb-content" style="display:none">
      <div class="lb-podium" id="lb-podium"></div>
      <div class="lb-list" id="lb-list"></div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/leaderboard.js"></script>
</body>
</html>
