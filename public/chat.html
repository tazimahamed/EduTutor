<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduTutor BD — AI Chat</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body.main-page{background:linear-gradient(135deg,#f0fdf8 0%,#e8f4ff 100%);min-height:100vh;}
    .chat-wrap{
      display:flex;flex-direction:column;
      height:calc(100vh - 130px);
      background:white;border-radius:20px;
      border:1.5px solid rgba(29,158,117,0.15);
      overflow:hidden;box-shadow:0 8px 32px rgba(29,158,117,0.1);
    }
    .chat-header{
      background:linear-gradient(135deg,#085041,#1D9E75);
      padding:18px 22px;display:flex;align-items:center;gap:14px;
      flex-shrink:0;
    }
    .chat-avatar{
      width:44px;height:44px;border-radius:50%;
      background:rgba(255,255,255,.2);
      display:flex;align-items:center;justify-content:center;
      font-size:22px;flex-shrink:0;
    }
    .chat-header-info h3{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;color:white;margin:0;}
    .chat-header-info p{font-size:12px;color:rgba(255,255,255,.75);margin:2px 0 0;}
    .chat-online{
      width:8px;height:8px;border-radius:50%;
      background:#4ade80;display:inline-block;margin-right:5px;
    }
    .subject-tabs{
      display:flex;gap:6px;padding:12px 16px;
      background:#f8fffe;border-bottom:1px solid rgba(29,158,117,0.1);
      flex-shrink:0;overflow-x:auto;
    }
    .subject-tab{
      padding:6px 14px;border-radius:20px;border:1.5px solid rgba(29,158,117,0.2);
      background:white;font-family:'Hind Siliguri',sans-serif;font-size:13px;font-weight:600;
      color:#0d1f1a;cursor:pointer;transition:all .2s;white-space:nowrap;
    }
    .subject-tab.active{background:#1D9E75;color:white;border-color:#1D9E75;}
    .chat-messages{
      flex:1;overflow-y:auto;padding:16px;
      display:flex;flex-direction:column;gap:12px;
    }
    .msg{display:flex;gap:10px;align-items:flex-end;}
    .msg.user{flex-direction:row-reverse;}
    .msg-avatar{
      width:32px;height:32px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:14px;flex-shrink:0;
    }
    .msg.ai .msg-avatar{background:linear-gradient(135deg,#1D9E75,#085041);color:white;}
    .msg.user .msg-avatar{background:linear-gradient(135deg,#378ADD,#185FA5);color:white;}
    .msg-bubble{
      max-width:72%;padding:12px 16px;border-radius:18px;
      font-size:14px;line-height:1.65;
    }
    .msg.ai .msg-bubble{
      background:#f0fdf8;border:1px solid rgba(29,158,117,0.15);
      border-bottom-left-radius:4px;color:#0d1f1a;
    }
    .msg.user .msg-bubble{
      background:linear-gradient(135deg,#1D9E75,#085041);
      color:white;border-bottom-right-radius:4px;
    }
    .msg-time{font-size:10px;color:#ccc;margin-top:4px;text-align:right;}
    .typing-indicator{display:flex;gap:4px;padding:8px 12px;}
    .typing-dot{
      width:8px;height:8px;border-radius:50%;
      background:#1D9E75;animation:typing 1.2s infinite;
    }
    .typing-dot:nth-child(2){animation-delay:.2s;}
    .typing-dot:nth-child(3){animation-delay:.4s;}
    @keyframes typing{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-8px);}}
    .chat-input-wrap{
      padding:14px 16px;
      background:#f8fffe;border-top:1px solid rgba(29,158,117,0.1);
      display:flex;gap:10px;align-items:flex-end;flex-shrink:0;
    }
    .chat-input{
      flex:1;border:1.5px solid rgba(29,158,117,0.2);
      border-radius:14px;padding:11px 16px;
      font-family:'Hind Siliguri',sans-serif;font-size:14px;
      resize:none;outline:none;max-height:100px;min-height:44px;
      transition:border-color .2s;background:white;
    }
    .chat-input:focus{border-color:#1D9E75;}
    .chat-send{
      width:44px;height:44px;border-radius:50%;
      background:linear-gradient(135deg,#1D9E75,#085041);
      border:none;color:white;font-size:18px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all .2s;flex-shrink:0;
    }
    .chat-send:hover{transform:scale(1.08);}
    .chat-send:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .quick-questions{
      display:flex;gap:8px;padding:0 16px 10px;
      overflow-x:auto;flex-shrink:0;
    }
    .quick-q{
      padding:7px 14px;background:#E1F5EE;
      border-radius:20px;font-size:12px;font-weight:600;color:#085041;
      cursor:pointer;white-space:nowrap;border:none;
      font-family:'Hind Siliguri',sans-serif;transition:all .2s;
    }
    .quick-q:hover{background:#1D9E75;color:white;}
  </style>
</head>
<body class="main-page">
  <nav class="navbar">
    <div class="nav-logo"><a href="home.html" style="text-decoration:none;color:inherit;">🎓 EduTutor BD</a></div>
    <div class="nav-user"><button class="btn btn-sm" onclick="logout()">লগআউট</button></div>
  </nav>
  <div class="main-container" style="padding-bottom:0;">
    <div class="chat-wrap">
      <div class="chat-header">
        <div class="chat-avatar">🤖</div>
        <div class="chat-header-info">
          <h3>EduTutor AI Assistant</h3>
          <p><span class="chat-online"></span>Online · যেকোনো প্রশ্ন করো বাংলায়</p>
        </div>
      </div>
      <div class="subject-tabs">
        <button class="subject-tab active" onclick="setSubject('physics',this)">⚛️ পদার্থ</button>
        <button class="subject-tab" onclick="setSubject('chemistry',this)">🧪 রসায়ন</button>
        <button class="subject-tab" onclick="setSubject('math',this)">📐 গণিত</button>
        <button class="subject-tab" onclick="setSubject('general',this)">💬 সাধারণ</button>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="msg ai">
          <div class="msg-avatar">🤖</div>
          <div>
            <div class="msg-bubble">আস-সালামু আলাইকুম! আমি তোমার AI শিক্ষক। পদার্থবিজ্ঞান, রসায়ন বা গণিতের যেকোনো প্রশ্ন করো — বাংলায় উত্তর দেবো! 😊</div>
            <div class="msg-time">এইমাত্র</div>
          </div>
        </div>
      </div>
      <div class="quick-questions" id="quick-qs">
        <button class="quick-q" onclick="sendQuick('নিউটনের গতিসূত্র কী?')">নিউটনের গতিসূত্র কী?</button>
        <button class="quick-q" onclick="sendQuick('pH স্কেল কী?')">pH স্কেল কী?</button>
        <button class="quick-q" onclick="sendQuick('দ্বিঘাত সমীকরণ কীভাবে সমাধান করি?')">দ্বিঘাত সমীকরণ</button>
        <button class="quick-q" onclick="sendQuick('আলোর প্রতিফলন ব্যাখ্যা করো')">আলোর প্রতিফলন</button>
      </div>
      <div class="chat-input-wrap">
        <textarea class="chat-input" id="chat-input" placeholder="এখানে প্রশ্ন লিখো..." rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
        <button class="chat-send" id="send-btn" onclick="sendMsg()">➤</button>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
